# URL koreňa existujúcej PHP/Vue aplikácie. Podpriečinok je podporovaný.
base.url=http://127.0.0.1:8080/

# Ukážkový účet z pôvodného seedu. Odporúčané: vlastný fixture účet od vyučujúceho.
test.email=student@example.test
test.password=Student123!

# gui = Selenium; api = REST Assured. Scenáre a očakávania sú rovnaké.
test.layer=gui
browser=chrome
headless=false
timeout.seconds=30

# Prázdne hodnoty použijú Selenium Manager a bežnú inštaláciu prehliadača.
# Na Windows používajte / alebo zdvojené spätné lomky v .properties.
# driver.path=C:/tools/chromedriver.exe
# browser.binary=C:/Program Files/Google/Chrome/Application/chrome.exe
driver.path=
browser.binary=
